name: Update Words Dictionary

on:
  schedule:
    # Run at 12:30 AM UTC every day
    - cron: "30 0 * * *"
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: write # Explicitly grant permission to push to the repository

jobs:
  update-words:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # Fetch all history for all branches

      - name: Install dependencies
        run: npm ci

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

      # scripts/solver.mjs looks for ./code (override with SOLVER_BIN)
      - name: Compile solver
        run: g++ -std=c++17 -O2 code.cpp -o code && chmod +x code

      # index.test.js exercises /solve, which needs a binary; point it at the
      # one just compiled rather than the container's main/code.
      - name: Run tests
        env:
          SOLVER_BIN: ${{ github.workspace }}/server/code
        run: npm test

      # Writes actual-words-<board>.txt and predictions-<board>.txt. A failed
      # scrape or solve leaves the file empty, which the updater reads as
      # "add-only" rather than "delete everything".
      - name: Scrape and solve classic board
        run: node scripts/scrape-and-solve.mjs --board classic

      - name: Scrape and solve mini board
        run: node scripts/scrape-and-solve.mjs --board mini

      # Runs before the dictionary update so the report measures the dictionary
      # the solver actually used, and is still sent on days with no changes
      - name: Compute daily stats and notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ vars.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
        run: node scripts/daily-stats.mjs

      - name: Commit stats history
        run: |
          cd ..
          if [ -n "$(git status --porcelain stats/)" ]; then
            git add stats/
            git commit -m "Update daily stats history"
            git push origin HEAD:main || echo "Failed to push stats"
          else
            echo "No stats changes to commit"
          fi

      # --observe records evidence without governing: classic already prunes and
      # acts as the control group for what a healthy board looks like.
      - name: Update dictionary from classic board
        env:
          TELEGRAM_BOT_TOKEN: ${{ vars.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
        run: |
          node scripts/update-words.mjs \
            --board classic \
            --actual actual-words-classic.txt \
            --predicted predictions-classic.txt \
            --observe ../stats/prune-gate.json \
            --commit-msg commit-msg-classic.txt

      # --gate lets the accumulated evidence decide. Mini starts add-only and
      # unlocks itself once enough confirmed words have been placed on its grids
      # and listed in its published answers; a single omission re-locks it. No
      # flag to remember to flip. See server/scripts/prune-gate.mjs.
      - name: Update dictionary from mini board
        env:
          TELEGRAM_BOT_TOKEN: ${{ vars.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
        run: |
          node scripts/update-words.mjs \
            --board mini \
            --actual actual-words-mini.txt \
            --predicted predictions-mini.txt \
            --gate ../stats/prune-gate.json \
            --commit-msg commit-msg-mini.txt

      # Persist every day's add/remove on main. words.txt, confirmed-words.txt
      # and the prune gate commit together: the allowlist is what makes a prune
      # safe and the gate is what authorised it, so neither may lag behind the
      # dictionary they justify. The gate moves on days the dictionary does not,
      # which is why it is part of the change check.
      - name: Commit dictionary changes
        run: |
          cd ..
          TRACKED="server/words.txt server/confirmed-words.txt stats/prune-gate.json"

          if [ -z "$(git status --porcelain $TRACKED)" ]; then
            echo "Dictionary and gate unchanged, nothing to commit"
            exit 0
          fi

          cat server/commit-msg-classic.txt server/commit-msg-mini.txt \
            > server/commit-msg.txt 2>/dev/null || true

          git add $TRACKED
          if [ -s server/commit-msg.txt ]; then
            git commit -F server/commit-msg.txt
          else
            git commit -m "Update dictionary: record confirmed answers and prune-gate evidence"
          fi

          git push origin HEAD:main || echo "Failed to push dictionary"
